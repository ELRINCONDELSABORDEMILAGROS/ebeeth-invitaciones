
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Estás invitado!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #fff5e8, #f7e4d1);
      color: #594638;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    /* SOBRE */
    #stage {
      position: relative;
      width: 100%;
      height: 270px;
      cursor: pointer;
      perspective: 1000px;
      margin-bottom: 25px;
    }

    .envelope {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 190px;
      background: #d9ad78;
      border-radius: 8px;
      box-shadow: 0 8px 20px #0002;
    }

    .envelope::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #c9955d;
      clip-path: polygon(0 0, 50% 60%, 100% 0);
      z-index: 3;
    }

    .flap {
      position: absolute;
      inset: 0;
      height: 100%;
      background: #e7bd8e;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      transform-origin: top;
      transition: transform 1s ease;
      z-index: 4;
    }

    .letter {
      position: absolute;
      left: 5%;
      width: 90%;
      height: 165px;
      bottom: 10px;
      background: #fffaf2;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: transform 1s ease;
      z-index: 2;
      padding: 15px;
    }

    .letter h2 {
      margin: 0 0 10px;
      color: #a87542;
    }

    #stage.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    #stage.open .letter {
      transform: translateY(-115px);
    }

    .tap {
      position: absolute;
      width: 100%;
      bottom: -30px;
      font-size: 14px;
      color: #876344;
    }

    /* INVITACIÓN */
    #invitation {
      display: none;
      background: #fffaf3;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 8px 25px #0002;
      animation: aparecer 1s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #invitation h1 {
      color: #a87542;
      font-size: 32px;
      margin: 5px 0;
    }

    #invitation h2 {
      font-size: 23px;
      margin: 8px 0;
    }

    #invitation p {
      line-height: 1.5;
      margin: 10px 0;
    }

    #themeArt {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 12px;
      margin: 15px auto;
    }

    .details {
      background: #f8ead9;
      border-radius: 12px;
      padding: 15px;
      margin: 18px 0;
    }

    .details p {
      margin: 9px 0;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 25px;
      margin: 12px 0;
      text-decoration: none;
      color: white;
      font-size: 16px;
      background: #bd914d;
      cursor: pointer;
      font-family: inherit;
    }

    .btn.whatsapp {
      background: #25a75a;
    }

    .footer {
      font-size: 13px;
      margin-top: 20px;
      color: #987b61;
    }

    /* BOTÓN DE MÚSICA */
    #musicButton {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 18px;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: #bd914d;
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px #0003;
      z-index: 100;
    }
  </style>
</head>

<body>

  <!-- MÚSICA -->
  <audio id="musica" loop preload="auto">
    <source src="musica-dinosaurios.mp3" type="audio/mpeg">
  </audio>

  <!-- BOTÓN PARA CONTROLAR LA MÚSICA -->
  <button id="musicButton" onclick="toggleMusic()" aria-label="Pausar o reproducir música">
    ♫
  </button>

  <div class="container">

    <!-- SOBRE -->
    <div id="stage" onclick="openInvitation()">
      <div class="envelope">
        <div class="letter">
          <h2>¡Estás invitado!</h2>
          <p>Tenemos una celebración especial...</p>
        </div>
        <div class="flap"></div>
      </div>

      <div class="tap">✉ Tocá el sobre para abrir tu invitación</div>
    </div>

    <!-- INVITACIÓN -->
    <div id="invitation">

      <p>¡Te esperamos para celebrar!</p>

      <h1 id="nombre">Mi cumpleaños</h1>

      <h2 id="edad"></h2>

      <img id="themeArt" alt="Imagen de la temática">

      <p id="mensaje"></p>

      <div class="details">
        <p>📅 <strong>Fecha:</strong> <span id="fecha"></span></p>
        <p>🕒 <strong>Hora:</strong> <span id="hora"></span></p>
        <p>📍 <strong>Lugar:</strong> <span id="lugar"></span></p>
        <p id="direccionFila">🏠 <span id="direccion"></span></p>
      </div>

      <a id="mapaBtn" class="btn" target="_blank" rel="noopener" style="display:none;">
        📍 Cómo llegar
      </a>

      <a id="waBtn" class="btn whatsapp" target="_blank" rel="noopener" style="display:none;">
        💚 Confirmar asistencia
      </a>

      <div class="footer">
        ¡Te esperamos para compartir un día inolvidable! ❤️
        <br><br>
        EBEETH | ARTE &amp; SABOR
      </div>

    </div>
  </div>

  <script>
    // OBTENER DATOS DE LA INVITACIÓN
    const params = new URLSearchParams(window.location.search);

    function dato(nombre, valorPorDefecto = "") {
      return params.get(nombre) || valorPorDefecto;
    }

    // COMPLETAR LOS DATOS
    document.getElementById("nombre").textContent =
      dato("nombre", "Mi cumpleaños");

    const edad = dato("edad");
    document.getElementById("edad").textContent =
      edad ? "¡Cumplo " + edad + " años!" : "";

    document.getElementById("fecha").textContent =
      dato("fecha", "A confirmar");

    document.getElementById("hora").textContent =
      dato("hora", "A confirmar");

    document.getElementById("lugar").textContent =
      dato("lugar", "A confirmar");

    const direccion = dato("direccion");
    document.getElementById("direccion").textContent = direccion;

    if (!direccion) {
      document.getElementById("direccionFila").style.display = "none";
    }

    document.getElementById("mensaje").textContent =
      dato("mensaje", "¡Te espero para festejar juntos!");

    // IMAGEN DE LA TEMÁTICA
    const imagen = dato("imagen");

    if (imagen) {
      const themeArt = document.getElementById("themeArt");
      themeArt.src = imagen;
      themeArt.style.display = "block";

      themeArt.onerror = function() {
        themeArt.style.display = "none";
      };
    }

    // GOOGLE MAPS
    const mapa = dato("mapa");

    if (mapa) {
      const mapaBtn = document.getElementById("mapaBtn");
      mapaBtn.href = mapa;
      mapaBtn.style.display = "block";
    }

    // WHATSAPP
    const wa = dato("wa");

    if (wa) {
      const waBtn = document.getElementById("waBtn");
      const mensajeWhatsApp =
        "¡Hola! Confirmo mi asistencia al cumpleaños de " +
        dato("nombre", "la celebración") + " 🎉";

      waBtn.href =
        "https://wa.me/" + wa.replace(/\D/g, "") +
        "?text=" + encodeURIComponent(mensajeWhatsApp);

      waBtn.style.display = "block";
    }

    // ABRIR INVITACIÓN Y ACTIVAR MÚSICA
    function openInvitation() {
      const stage = document.getElementById("stage");

      // Evitar que se abra varias veces
      if (stage.classList.contains("open")) {
        return;
      }

      stage.classList.add("open");

      setTimeout(function() {
        document.getElementById("invitation").style.display = "block";
      }, 700);

      const musica = document.getElementById("musica");
      const boton = document.getElementById("musicButton");

      boton.style.display = "block";

      musica.play().then(function() {
        boton.textContent = "♫";
      }).catch(function() {
        // Si el navegador bloquea la reproducción,
        // la persona puede tocar el botón para iniciarla.
        boton.textContent = "▶";
      });
    }

    // PAUSAR O REPRODUCIR MÚSICA
    function toggleMusic() {
      const musica = document.getElementById("musica");
      const boton = document.getElementById("musicButton");

      if (musica.paused) {
        musica.play().then(function() {
          boton.textContent = "♫";
        }).catch(function() {
          boton.textContent = "▶";
        });
      } else {
        musica.pause();
        boton.textContent = "▶";
      }
    }
  </script>

</body>
</html>
